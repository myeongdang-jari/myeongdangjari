<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>QA · 브릿지 v2 화면 검사</title>
<style>
  body{margin:0;background:#20261f;color:#e7e6da;font:13px/1.5 -apple-system,Pretendard,sans-serif}
  .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:9px 14px;position:sticky;top:0;z-index:3;
       background:#20261f;border-bottom:1px solid #38402f}
  .bar b{font-size:12px;letter-spacing:.08em;color:#9aa694;margin-right:4px}
  .bar button{font:inherit;padding:4px 11px;border:1px solid #4c5742;background:transparent;color:#e7e6da;border-radius:99px;cursor:pointer}
  .bar button.on{background:#8fa392;color:#1b2e24;border-color:#8fa392}
  .bar input{width:70px;padding:4px 7px;border:1px solid #4c5742;background:#2a3126;color:#e7e6da;border-radius:4px}
  .bar select{padding:4px 7px;border:1px solid #4c5742;background:#2a3126;color:#e7e6da;border-radius:4px}
  .bar .out{font-variant-numeric:tabular-nums;color:#bfc9b6;font-size:12px}
  .bar .out.err{color:#f0a3a3}
  .stage{padding:12px}
  iframe{width:375px;height:900px;border:0;background:#fff;display:block;margin:0 auto}
</style>
</head>
<body>
<div class="bar">
  <b>폭</b>
  <button data-w="375" class="on">375</button>
  <button data-w="414">414</button>
  <button data-w="768">768</button>
  <button data-w="1024">1024</button>
  <button data-w="1440">1440</button>
  <input id="w" type="number" value="375" min="240" max="2200" aria-label="폭 직접 입력">
  <b>스크롤</b>
  <input id="sy" type="number" value="0" min="0" max="20000" step="100" aria-label="세로 스크롤">
  <b>화면</b>
  <select id="src" aria-label="화면 선택">
    <option value="../index.html">처음</option>
    <option value="../index.html#s-street">2장</option>
    <option value="../index.html#p=bm-homstar-pink">모달</option>
  </select>
  <button id="refresh">새로고침</button>
  <span class="out" id="out">—</span>
</div>
<div class="stage"><iframe id="f" title="쿠팡 브릿지 화면"></iframe></div>
<script>
(function(){
  var f = document.getElementById('f'), out = document.getElementById('out');
  function setW(w){ f.style.width = w + 'px'; document.getElementById('w').value = w;
    Array.prototype.forEach.call(document.querySelectorAll('.bar button[data-w]'), function(b){
      b.classList.toggle('on', b.dataset.w === String(w)); }); }
  Array.prototype.forEach.call(document.querySelectorAll('.bar button[data-w]'), function(b){
    b.addEventListener('click', function(){ setW(b.dataset.w); }); });
  document.getElementById('w').addEventListener('input', function(e){
    var v = parseInt(e.target.value, 10); if(v >= 240) setW(v); });
  document.getElementById('sy').addEventListener('input', function(e){
    var v = parseInt(e.target.value, 10); if(v >= 0) try{ f.contentWindow.scrollTo(0, v); }catch(err){} });
  function bust(u){ return u + (u.indexOf('?') < 0 ? '?' : '&') + 'cb=' + Date.now(); }
  document.getElementById('src').addEventListener('change', function(e){ f.src = bust(e.target.value); });
  document.getElementById('refresh').addEventListener('click', function(){ f.src = bust(f.getAttribute('src')); });

  window.qa = function(){
    var d = f.contentDocument, win = f.contentWindow;
    if(!d) return {error: 'iframe not readable'};
    var vw = d.documentElement.clientWidth, over = [];
    Array.prototype.forEach.call(d.querySelectorAll('body *'), function(el){
      var r = el.getBoundingClientRect(), cs = win.getComputedStyle(el);
      if(r.width > 0 && r.right > vw + 1 && cs.position !== 'fixed' && cs.overflowX === 'visible'){
        over.push((el.className || el.tagName) + ' → ' + Math.round(r.right));
      }
    });
    var card = d.querySelector('.chapter .card'), tools = d.querySelector('.tools');
    return {
      frameWidth: f.clientWidth, innerWidth: win.innerWidth,
      scrollWidth: d.documentElement.scrollWidth, bodyScrollWidth: d.body.scrollWidth,
      overflowCount: over.length, overflowSample: over.slice(0, 6),
      cards: d.querySelectorAll('.card').length,
      scrollY: Math.round(win.scrollY || 0),
      firstCardY: card ? Math.round(card.getBoundingClientRect().top + (win.scrollY || 0)) : null,
      toolsH: tools ? tools.offsetHeight : null,
      dlgOpen: !d.getElementById('dv').hidden,
      dlgTitle: d.getElementById('dt').textContent.slice(0, 30)
    };
  };
  function tick(){
    try{ var r = window.qa();
      out.textContent = r.frameWidth + 'px · scrollWidth ' + r.scrollWidth + ' / ' + r.innerWidth +
        (r.scrollWidth <= r.innerWidth ? ' ✓' : ' ✗ 넘침 ' + r.overflowCount) +
        ' · 카드 ' + r.cards + ' · 첫카드 y' + r.firstCardY + (r.dlgOpen ? ' · 모달열림' : '');
      out.className = 'out' + (r.scrollWidth <= r.innerWidth ? '' : ' err');
    }catch(e){ out.textContent = '측정 실패: ' + e.message; out.className = 'out err'; }
  }
  f.addEventListener('load', tick);
  setInterval(tick, 1200);
  setTimeout(tick, 700);
  setW(375);
  f.src = bust('../index.html'); // 캐시 무시하고 항상 최신 빌드를 본다
})();
</script>
</body>
</html>
